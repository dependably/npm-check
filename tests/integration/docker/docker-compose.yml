version: '3.8'

# Local reproduction of the CI Node matrix (the package supports Node >= 22).
services:
  # Node 22 with npm 10 (minimum supported)
  test-node22-npm10:
    build:
      context: ../../..
      dockerfile: tests/integration/docker/Dockerfile
      args:
        NODE_VERSION: 22
        NPM_VERSION: 10
    volumes:
      - ../../../src:/workspace/src:ro
      - ../../../tests:/workspace/tests:ro
      - test-cache-22-10:/root/.npm
    environment:
      - NODE_ENV=test
      - CI=true

  # Node 24 with npm 11 (current)
  test-node24-npm11:
    build:
      context: ../../..
      dockerfile: tests/integration/docker/Dockerfile
      args:
        NODE_VERSION: 24
        NPM_VERSION: 11
    volumes:
      - ../../../src:/workspace/src:ro
      - ../../../tests:/workspace/tests:ro
      - test-cache-24-11:/root/.npm
    environment:
      - NODE_ENV=test
      - CI=true

volumes:
  test-cache-22-10:
  test-cache-24-11:
