# CI for the public GitHub mirror (https://github.com/dependably/npm-check).
#
# GitLab (gitlab.northwardlabs.ca/moonlitlabs/npm-check) stays the source of
# truth and runs the authoritative pipeline (.gitlab-ci.yml: lint, tests, SBOM,
# private-registry publish). This workflow is the CI that runs *on GitHub* once
# the GitLab `publish-github` manual job mirrors the branch here. It needs no
# secrets and no private-registry access, so it works for forks and external
# contributors out of the box.
#
# This workflow PUBLISHES THE PACKAGE NOWHERE. Releases go to the private
# Dependably registry from GitLab's `publish` job alone; the GitHub side keeps
# the signed, downloadable artifacts (Release + attestations) without a publish.
# The `release` job below carries the full reasoning.
#
# Installs here come from the public npm registry because the repo's own
# committed `.npmrc` pins `registry=https://registry.npmjs.org/` (and every
# `resolved` URL in package-lock.json is absolute anyway). A project `.npmrc`
# outranks the userconfig `actions/setup-node` writes, so no `registry-url:`
# input is needed on any setup-node step here — and none is set. Don't re-add
# one: its actual effect is to write an NODE_AUTH_TOKEN-bearing `.npmrc`, i.e.
# publish plumbing.
#
# Jobs:  secret-scan (trufflehog)  ·  lint  ·  test (matrix)  ·  build (npm pack)
#        sbom (production-only CycloneDX 1.6 SBOM, uploaded as a build artifact)
#        release (tags v* only — creates a GitHub Release + attaches the .tgz +
#                 SLSA build provenance, L2; also signs + attaches the production
#                 SBOM to the Release)
#
# Action pins: every `uses:` step is pinned by commit SHA for supply-chain
# safety, with the human-readable version in a trailing `# vN` comment. The
# chosen majors: checkout/setup-node `v5` and attest-build-provenance `v2` run on
# the Node 24 runtime; actions/upload-artifact is `v7` (its v5/v5.0.0 still
# declare `using: node20`; only v6+ moved to node24). Bump a SHA when updating
# the version comment alongside it (e.g. via Dependabot/Renovate).

name: CI

on:
  push:
    branches: [main]
    # A release is cut by pushing a `v*` tag — the `release` job below then creates
    # the GitHub Release, attaches the packed tarball, and emits SLSA provenance.
    # This mirrors the nuget-check pipeline (tag-driven, self-creating release).
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (mirrors the GitLab auto-cancel policy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan — fail the build if a committed secret is detected. We run the
  # SAME trufflehog image pinned by digest as the GitLab `secret-scan` job, for
  # parity and so the scanner version can't drift. fetch-depth: 0 gives a full
  # history scan; --only-verified keeps it fast and false-positive-free; --fail
  # hard-fails on a finding.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: TruffleHog (full-history, verified secrets only)
        run: |
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog:3.95.3@sha256:9cc33bb080cac0efbbf228a17667172875b529eeeab01efcc4697adfb55f568a \
            git file:///repo --only-verified --fail

  # Verifies the vendored conformance/dependably/ copy (conformance/) still matches
  # the commit VENDOR.md pins it to. VENDOR.md records that provenance but proves
  # nothing on its own — this turns the pin into a checked assertion instead of a
  # comment nobody re-reads. It does NOT fail because the spec repo's main has moved
  # on; sitting on an older commit is a legitimate, deliberate choice. It fails only
  # when the local copy no longer matches what it claims to be pinned at.
  vendor-corpus-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: sh ci/verify-vendored-corpus.sh conformance

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # Unit tests across the supported Node range (package.json engines: >=22) — the
  # two current LTS lines. 18 and 20 are end-of-life and dropped.
  # Integration tests are Docker/registry-based and stay on-demand, matching the
  # GitLab pipeline (which also runs only unit tests inline).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # "Build" is just packing the publishable tarball — this is a pure-ESM package
  # with no transpile step. npm pack honors the package.json `files` allowlist.
  # Gated behind lint + test so we never publish an artifact from a red build.
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarball
          path: "*.tgz"
          retention-days: 7

  # Production-only CycloneDX 1.6 SBOM, uploaded as a build artifact on every run
  # (push / PR / tag). `npm run sbom:prod` runs cyclonedx-npm with --omit dev, so it
  # captures only the runtime dependency (`yaml`) that ships in the published tarball —
  # dev tooling (jest, eslint, babel, …) is excluded. On a `v*` tag the release job
  # downloads this same sbom.json, signs it (keyless OIDC/sigstore), and attaches it to
  # the GitHub Release. sbom:prod writes sbom-prod.json; we normalize the name to
  # sbom.json so the released asset matches the rest of the suite.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sbom:prod && cp sbom-prod.json sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 7

  # Release the packed tarball with a signed SLSA build provenance — SLSA Build
  # L2. Tag-driven and self-creating, mirroring the nuget-check `release` job:
  # pushing a `v*` tag creates the GitHub Release, attaches the packed tarball,
  # and signs it — so the released artifact is visible and verifiable on GitHub
  # itself.
  #
  # This job PUBLISHES TO NO REGISTRY, deliberately. Publishing is GitLab's
  # `publish` job (.gitlab-ci.yml), which pushes the same packed tarball to the
  # private Dependably registry ($REGISTRY_URL / REGISTRY_PUBLISH_KEY, manual
  # gate on a protected `vX.Y.Z` tag) and reads the version back afterwards to
  # prove it landed. Two reasons the GitHub side stays out of it:
  #
  #   1. Nothing in this org publishes to public npmjs, or to any other public
  #      registry. An earlier revision of this job ran
  #      `npm publish --access public --provenance` against registry.npmjs.org
  #      and failed the release when NPM_TOKEN was absent. That shape is the bug;
  #      the missing token is not. Do NOT add, request, or reference an
  #      NPM_TOKEN here.
  #   2. Repointing it at $REGISTRY_URL instead would give one artifact two
  #      publishers — GitLab's job already serializes (`resource_group`), splits
  #      the publish and read-back tokens by capability, and verifies the result
  #      — and would copy a publish-scoped private-registry credential into
  #      GitHub secrets. Neither buys anything.
  #
  # What that costs, and what it does not: `npm publish --provenance` records
  # sigstore provenance on the npmjs package PAGE (`npm audit signatures`), which
  # works ONLY against the public registry, so it goes with the publish. The
  # signed-release property does not go with it —
  # actions/attest-build-provenance below signs the exact packed *.tgz and stores
  # the attestation in GitHub (repo "Attestations" tab; verify with
  # `gh attestation verify <tarball> -R dependably/npm-check`), the SAME
  # registry-independent mechanism the NuGet pipeline uses. The SBOM is signed
  # and attached the same way.
  #
  # We `npm pack` ONCE and attest + release the same bytes, so the attestation
  # matches the released artifact exactly; GitLab's publish job packs the same
  # tag with the same `files` allowlist.
  #
  # Runs only on a `v*` tag, after the gating jobs pass. Keyless: id-token: write
  # drives the OIDC->sigstore signatures (tarball + SBOM). No registry credential
  # of any kind is used by this job.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [secret-scan, vendor-corpus-check, lint, test, build, sbom]
    permissions:
      contents: write      # create the GitHub Release + upload the .tgz asset
      id-token: write      # OIDC -> sigstore signature for the GitHub attestations
      attestations: write  # store the GitHub build-provenance attestation on the repo
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pack the exact tarball we attest and release (one set of bytes).
      - run: npm pack
      # NuGet-equivalent: signed GitHub attestation over the tarball, registry-
      # independent.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "*.tgz"
      # Attach the attested .tgz to a GitHub Release so the exact signed bytes are
      # downloadable and verifiable by digest — the artifact you see on GitHub.
      - name: Publish .tgz to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" *.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" *.tgz --clobber
      # Production-dependency SBOM: pull the exact bytes the `sbom` job produced, sign
      # them with the same keyless OIDC/sigstore flow, and attach the SBOM plus its
      # sigstore bundle to the Release so consumers can verify what shipped:
      #   gh attestation verify sbom.json -R dependably/npm-check
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: .
      - name: Attest SBOM
        id: attest_sbom
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "sbom.json"
      - name: Attach signed SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cp "${{ steps.attest_sbom.outputs.bundle-path }}" sbom.json.sigstore.json
          gh release upload "$GITHUB_REF_NAME" sbom.json sbom.json.sigstore.json --clobber
